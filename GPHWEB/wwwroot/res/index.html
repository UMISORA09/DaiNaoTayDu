<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta http-equiv="Cache-Control" content="no-cache" />
<link rel="shortcut icon" href="" type="image/x-icon" />

<style type="text/css">
html,body{ 
	margin:0; 
	height:100%; 
	overflow:hidden;
	background-color:#000;
}


#container {
	position:relative;
	margin:auto;
	color:#3f3;
	text-align:center;
	font-size:30px;
	height:100%;
}
#MPlayer{
	width:10px;
	height:1px;
	margin:0 auto;
	margin-left:150px;
	position:absolute;
	z-index: 10;	
}
</style>
<script type="text/javascript" src="js/swfobject.js"></script>
<script type="text/javascript">
	function $g(id)
	{
		return document.getElementById(id);
	}
	
	var unloadFlag = true;
	var unloadStr = "是否要退出至尊仙灵";
	function setUnloadString(str)
	{
		unloadStr = str;
	}
	
	function setUnloadFlag()
	{
		unloadFlag = false;
	}
	
	window.onbeforeunload = function(event){
		if(unloadFlag)
		{
			if(addfavorite('至尊仙灵','zzxl.kunlun.com')==false){
				return unloadStr;
			}
		}
	}
	function addfavorite(title,url){
		if (document.all){
			window.external.addFavorite(url,title);
		}else if (window.sidebar){
			window.sidebar.addPanel(title, url, "");
		}else{
			return false;
		}
		return true;
	}
	
    var swfVersionStr = "10.0.0";
    var xiSwfUrlStr = "";
    var params = {
				menu: "false",
				scale: "noScale",
				allowFullscreen: "true",
				allowScriptAccess: "always",
				wmode:"direct"
			};
    var attributes = {
				id:"Main"
			};
			
			
	var flashvars =
	{
		lcid:(new Date()).valueOf().toString(16) + (Math.random() * 1000 >>0).toString(16)
	};
			
	var domain = "";
	if(domain)
	{
		var base = document.createElement("base");
		var head = document.getElementsByTagName("head")[0];
		base.href = domain;
		head.appendChild(base);
	}
	
	var swf = domain + "Main.swf?" + (new Date()).valueOf().toString(16);
	function load()
	{
		swfobject.embedSWF(
	    swf, "Main",
	    "100%", "100%",
	    swfVersionStr, xiSwfUrlStr,
	    flashvars, params, attributes);
			
		swfobject.embedSWF( domain + "MPlayer.swf","MPlayer","10","2", swfVersionStr,xiSwfUrlStr,flashvars);
	}
    
</script>

</head>
<body onload="load()">
	<div id="container">
    	<div id="MPlayer"></div>
		<div id="Main"> <a href="http://www.adobe.com/go/getflash"> 点此下载Flash Player </a>
          <p>此页要求 Flash Player 版本 10.0.0 或更高版本。</p>
        </div>
	</div>
</body>
</html>
